name: Generate Manga Reader App

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Android Project Files
        run: |
          # 1. Create directory structure
          mkdir -p .github/workflows
          mkdir -p app/src/main/java/com/example/mangareader

          # 2. settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MangaScreenReader"
          include(":app")
          EOF

          # 3. root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.3.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # 4. app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.mangareader"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.mangareader"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("com.google.mlkit:text-recognition-japanese:16.0.1")
          }
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <application
                  android:allowBackup="true"
                  android:label="Manga Reader"
                  android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".ScreenReaderService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>
          EOF

          # 6. MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/example/mangareader/MainActivity.kt
          package com.example.mangareader

          import android.content.Context
          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              private lateinit var mediaProjectionManager: MediaProjectionManager

              private val captureLauncher = registerForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { result ->
                  if (result.resultCode == RESULT_OK && result.data != null) {
                      val serviceIntent = Intent(this, ScreenReaderService::class.java).apply {
                          putExtra("RESULT_CODE", result.resultCode)
                          putExtra("DATA_INTENT", result.data)
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(serviceIntent)
                      } else {
                          startService(serviceIntent)
                      }
                      finish()
                  } else {
                      Toast.makeText(this, "Screen capture permission denied", Toast.LENGTH_SHORT).show()
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val btn = Button(this).apply {
                      text = "Start Manga Screen Reader"
                      setOnClickListener { checkOverlayAndStart() }
                  }
                  setContentView(btn)
                  mediaProjectionManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
              }

              private fun checkOverlayAndStart() {
                  if (!Settings.canDrawOverlays(this)) {
                      val intent = Intent(
                          Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:$packageName")
                      )
                      startActivity(intent)
                  } else {
                      captureLauncher.launch(mediaProjectionManager.createScreenCaptureIntent())
                  }
              }
          }
          EOF

          # 7. ScreenReaderService.kt
          cat << 'EOF' > app/src/main/java/com/example/mangareader/ScreenReaderService.kt
          package com.example.mangareader

          import android.annotation.SuppressLint
          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.IBinder
          import android.speech.tts.TextToSpeech
          import android.util.DisplayMetrics
          import android.view.*
          import android.widget.ImageView
          import android.widget.Toast
          import androidx.core.app.NotificationCompat
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.japanese.JapaneseTextRecognizerOptions
          import java.util.Locale

          class ScreenReaderService : Service(), TextToSpeech.OnInitListener {
              private lateinit var windowManager: WindowManager
              private var floatingView: View? = null
              private var mediaProjection: MediaProjection? = null
              private var virtualDisplay: VirtualDisplay? = null
              private var imageReader: ImageReader? = null
              private var tts: TextToSpeech? = null
              private val recognizer = TextRecognition.getClient(JapaneseTextRecognizerOptions.Builder().build())

              private var screenWidth = 0
              private var screenHeight = 0
              private var screenDensity = 0

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  tts = TextToSpeech(this, this)
                  initDisplayMetrics()
                  startNotification()
                  createFloatingWidget()
              }

              private fun initDisplayMetrics() {
                  windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val metrics = DisplayMetrics()
                  @Suppress("DEPRECATION")
                  windowManager.defaultDisplay.getRealMetrics(metrics)
                  screenWidth = metrics.widthPixels
                  screenHeight = metrics.heightPixels
                  screenDensity = metrics.densityDpi
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val resultCode = intent?.getIntExtra("RESULT_CODE", Activity.RESULT_CANCELED) ?: return START_NOT_STICKY
                  val data = intent.getParcelableExtra<Intent>("DATA_INTENT") ?: return START_NOT_STICKY
                  val mpManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  mediaProjection = mpManager.getMediaProjection(resultCode, data)
                  setupVirtualDisplay()
                  return START_STICKY
              }

              @SuppressLint("WrongConstant")
              private fun setupVirtualDisplay() {
                  imageReader = ImageReader.newInstance(screenWidth, screenHeight, PixelFormat.RGBA_8888, 2)
                  virtualDisplay = mediaProjection?.createVirtualDisplay(
                      "ScreenReaderCapture",
                      screenWidth, screenHeight, screenDensity,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                      imageReader?.surface, null, null
                  )
              }

              @SuppressLint("ClickableViewAccessibility")
              private fun createFloatingWidget() {
                  val layoutFlag = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      @Suppress("DEPRECATION")
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      layoutFlag,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 60
                      y = 300
                  }

                  val button = ImageView(this).apply {
                      setImageResource(android.R.drawable.ic_btn_speak_now)
                      setBackgroundColor(0xAA000000.toInt())
                      setPadding(28, 28, 28, 28)
                  }

                  button.setOnClickListener { captureAndRead() }
                  button.setOnTouchListener(object : View.OnTouchListener {
                      private var initX = 0
                      private var initY = 0
                      private var initTouchX = 0f
                      private var initTouchY = 0f

                      override fun onTouch(v: View?, event: MotionEvent): Boolean {
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  initX = params.x
                                  initY = params.y
                                  initTouchX = event.rawX
                                  initTouchY = event.rawY
                                  return false
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  params.x = initX + (event.rawX - initTouchX).toInt()
                                  params.y = initY + (event.rawY - initTouchY).toInt()
                                  windowManager.updateViewLayout(floatingView, params)
                                  return true
                              }
                          }
                          return false
                      }
                  })

                  floatingView = button
                  windowManager.addView(floatingView, params)
              }

              private fun captureAndRead() {
                  val image = imageReader?.acquireLatestImage() ?: run {
                      Toast.makeText(this, "Capturing screen...", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val planes = image.planes
                  val buffer = planes[0].buffer
                  val pixelStride = planes[0].pixelStride
                  val rowStride = planes[0].rowStride
                  val rowPadding = rowStride - pixelStride * screenWidth

                  val bitmap = Bitmap.createBitmap(
                      screenWidth + rowPadding / pixelStride,
                      screenHeight,
                      Bitmap.Config.ARGB_8888
                  )
                  bitmap.copyPixelsFromBuffer(buffer)
                  image.close()

                  val cleanBitmap = Bitmap.createBitmap(bitmap, 0, 0, screenWidth, screenHeight)
                  val inputImage = InputImage.fromBitmap(cleanBitmap, 0)

                  recognizer.process(inputImage)
                      .addOnSuccessListener { visionText ->
                          val fullText = visionText.textBlocks.joinToString(" ") { it.text }
                          if (fullText.isNotBlank()) {
                              tts?.speak(fullText, TextToSpeech.QUEUE_FLUSH, null, "MangaReadID")
                          } else {
                              Toast.makeText(this, "No dialogue detected", Toast.LENGTH_SHORT).show()
                          }
                      }
                      .addOnFailureListener { e ->
                          Toast.makeText(this, "OCR failed: ${e.message}", Toast.LENGTH_SHORT).show()
                      }
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      tts?.language = Locale.JAPANESE
                  }
              }

              private fun startNotification() {
                  val channelId = "MangaReaderChannel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(channelId, "Manga Reader", NotificationManager.IMPORTANCE_LOW)
                      val manager = getSystemService(NotificationManager::class.java)
                      manager.createNotificationChannel(channel)
                  }
                  val notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("Manga Reader Active")
                      .setContentText("Tap the floating icon on any screen to read dialogue")
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .build()
                  startForeground(101, notification)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  tts?.shutdown()
                  floatingView?.let { windowManager.removeView(it) }
                  virtualDisplay?.release()
                  mediaProjection?.stop()
                  imageReader?.close()
              }
          }
          EOF

          # 8. build-apk.yml (Workflow that builds the actual APK)
          cat << 'EOF' > .github/workflows/build-apk.yml
          name: Build Debug APK
          on:
            push:
              branches: [ "main", "master" ]
            workflow_dispatch:
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout code
                  uses: actions/checkout@v4
                - name: Set up JDK 17
                  uses: actions/setup-java@v4
                  with:
                    distribution: 'zulu'
                    java-version: '17'
                - name: Setup Gradle
                  uses: gradle/actions/setup-gradle@v3
                  with:
                    gradle-version: 8.6
                - name: Build Debug APK
                  run: gradle :app:assembleDebug --stacktrace
                - name: Upload APK
                  uses: actions/upload-artifact@v4
                  with:
                    name: MangaReader-Debug-APK
                    path: app/build/outputs/apk/debug/app-debug.apk
          EOF

                  - name: Commit and Push Project Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add complete Manga Reader project files" || exit 0
          git push origin HEAD
