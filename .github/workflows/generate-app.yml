name: Generate Manga Reader App

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create Generator Script
        run: |
          cat << 'EOF' > generate.py
          import urllib.request
          import urllib.error
          import json
          import os
          import sys

          api_key = os.environ.get("GEMINI_API_KEY", "").strip()
          if not api_key:
              print("::error::GEMINI_API_KEY secret is not set!")
              sys.exit(1)

          prompt = """Return ONLY a single valid raw JSON dictionary. Do not wrap in markdown or backticks.
          Keys are file paths, values are full file contents for an Android Kotlin project:
          1. settings.gradle.kts
          2. build.gradle.kts
          3. app/build.gradle.kts (compileSdk 34, com.google.mlkit:text-recognition-japanese:16.0.1, androidx)
          4. app/src/main/AndroidManifest.xml (SYSTEM_ALERT_WINDOW, FOREGROUND_SERVICE, FOREGROUND_SERVICE_MEDIA_PROJECTION)
          5. app/src/main/java/com/example/mangareader/MainActivity.kt
          6. app/src/main/java/com/example/mangareader/ScreenReaderService.kt (overlay chathead, ImageReader capture, ML Kit Japanese text recognition, Android TextToSpeech)
          7. .github/workflows/build-apk.yml (actions/checkout@v4, setup-java@v4 zulu 17, gradle :app:assembleDebug, upload-artifact@v4)"""

          url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key={api_key}"
          payload = {
              "contents": [{"parts": [{"text": prompt}]}],
              "generationConfig": {"response_mime_type": "application/json"}
          }

          try:
              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json"}
              )
              with urllib.request.urlopen(req) as resp:
                  res = json.loads(resp.read().decode("utf-8"))
                  raw_text = res["candidates"][0]["content"]["parts"][0]["text"].strip()
                  files = json.loads(raw_text)

              for path, content in files.items():
                  os.makedirs(os.path.dirname(path), exist_ok=True)
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)
                  print(f"Created: {path}")

          except urllib.error.HTTPError as err:
              print(f"::error::API Error {err.code}: {err.read().decode('utf-8')}")
              sys.exit(1)
          except Exception as e:
              print(f"::error::Failed: {e}")
              sys.exit(1)
          EOF

      - name: Generate Code
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-generate Manga Reader app" || exit 0
          git push origin main
